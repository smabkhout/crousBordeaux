name: check-crous

on:
  workflow_dispatch:

concurrency:
  group: check-crous
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
  
      - name: Keep CROUS session 1 alive
        continue-on-error: true
        env:
          COOKIE: ${{ secrets.CROUS_COOKIE }}
        run: |
          curl -s --max-time 20 -b "$COOKIE" \
            -o /tmp/crous1.html -w '%{http_code}\n' \
            https://trouverunlogement.lescrous.fr/
          if grep -q 'Déconnexion' /tmp/crous1.html; then
            echo "session 1 alive"
          else
            echo "::warning::session 1 dead - re-login and update CROUS_COOKIE"
          fi

      - name: Keep CROUS session 2 alive
        continue-on-error: true
        env:
          COOKIE: ${{ secrets.CROUS_COOKIE_2 }}
        run: |
          curl -s --max-time 20 -b "$COOKIE" \
            -o /tmp/crous2.html -w '%{http_code}\n' \
            https://trouverunlogement.lescrous.fr/
          if grep -q 'Déconnexion' /tmp/crous2.html; then
            echo "session 2 alive"
          else
            echo "::warning::session 2 dead - re-login and update CROUS_COOKIE_2"
          fi

      - name: Check CROUS availability
        id: check
        env:
          CROUS_URL: ${{ vars.CROUS_URL }}
        run: python check.py

      - name: Send email on change
        if: steps.check.outputs.changed == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: BORDEAUX-CROUS Watcher <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "CROUS availability changed: ${{ steps.check.outputs.previous }} → ${{ steps.check.outputs.total }}"
          body: |
            New accommodations available in your CROUS search zone!
          
            Previous: ${{ steps.check.outputs.previous }}
            Now:      ${{ steps.check.outputs.total }}
          
            📋 Available Listings:
            ${{ steps.check.outputs.items }}
          
            🌍 View all listings: ${{ vars.CROUS_URL }}
      - name: Commit state
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "no state change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "state: ${{ steps.check.outputs.previous }} -> ${{ steps.check.outputs.total }}"
          git push
